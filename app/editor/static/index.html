<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- textos em inglês (a chave); i18n.js traduz o que tem data-i18n (texto) e data-i18n-attr (atributos) -->
<nav class="rail" data-i18n-attr="aria-label=Sections">
  <img class="brand-mark" src="favicon.svg" alt="Deck" width="36" height="36">
  <button class="rail-btn" data-section="keys" aria-current="page"><i data-lu="layout-grid"></i><span data-i18n>Keys</span></button>
  <button class="rail-btn" data-section="light" aria-current="false"><i data-lu="lightbulb"></i><span data-i18n>Light</span></button>
  <button class="rail-btn" data-section="auto" aria-current="false"><i data-lu="zap"></i><span data-i18n>Automations</span></button>
  <button class="rail-btn" data-section="settings" aria-current="false"><i data-lu="settings"></i><span data-i18n>Settings##3</span></button>
</nav>
<div class="app">
<header class="top">
  <button class="lib-toggle icon-btn" id="libToggle" data-i18n-attr="aria-label=Show actions|title=Actions"><i data-lu="menu"></i></button>
  <h1 class="section-name" id="sectionTitle"></h1>
  <div class="spacer"></div>
  <div class="status-group" role="status" aria-live="polite">
    <div class="status" id="status"></div>
    <span class="save-state" id="saveState"></span>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="btnUndo" data-i18n-attr="title=Undo (Ctrl+Z)|aria-label=Undo"><i data-lu="undo-2"></i></button>
    <button class="icon-btn" id="btnRedo" data-i18n-attr="title=Redo (Ctrl+Y)|aria-label=Redo"><i data-lu="redo-2"></i></button>
    <button class="icon-btn" id="btnHistory" data-i18n-attr="title=Version history|aria-label=Version history"><i data-lu="history"></i></button>
  </div>
</header>

<div class="workspace" id="workspace">
  <aside class="library" id="library" data-i18n-attr="aria-label=Actions">
    <div class="lib-search">
      <i data-lu="search"></i>
      <input id="libSearch" type="search" data-i18n-attr="placeholder=Search actions|aria-label=Search actions">
    </div>
    <div class="lib-list" id="libList"></div>
    <p class="lib-tip" data-i18n>Drag an action onto a Deck key, or into the list of steps.</p>
  </aside>

  <main class="stage" id="stage">
    <div class="stage-top" id="stageTop">
      <nav class="pages" id="pages" data-i18n-attr="aria-label=Pages"></nav>
      <div id="viewToggle"></div>
    </div>
    <div class="deck-wrap" id="deckWrap">
      <div class="deck" id="deck">
        <div class="keys" id="keys" role="grid" data-i18n-attr="aria-label=Deck keys"></div>
      </div>
    </div>
    <div class="stage-bar" id="stageBar"></div>
    <div class="expand-view" id="expandView" hidden></div>
    <div class="problems" id="problems" hidden></div>
  </main>

  <aside class="inspector" id="inspector" aria-live="polite"></aside>
</div>
<main class="light-view" id="lightView" hidden></main>
<main class="settings-view" id="settingsView" hidden></main>
<main class="auto-view" id="autoView" hidden></main>
</div>

<div class="sheet" id="glyphSheet" hidden>
  <div class="sheet-card" role="dialog" data-i18n-attr="aria-label=Choose icon">
    <div class="sheet-head">
      <input id="glyphSearch" type="search" data-i18n-attr="placeholder=Search icons (e.g.: mic, play, folder, light)">
      <button class="icon-btn" id="glyphClose" data-i18n-attr="aria-label=Close"><i data-lu="x"></i></button>
    </div>
    <div class="glyph-grid" id="glyphGrid"></div>
    <p class="fine" data-i18n>These are the Lucide icons (lucide.dev), the same ones used in the editor. Search works in English and Portuguese.</p>
  </div>
</div>

<div class="sheet" id="actionSheet" hidden>
  <div class="sheet-card" role="dialog" data-i18n-attr="aria-label=Choose action">
    <div class="sheet-head">
      <input id="actionSearch" type="search" data-i18n-attr="placeholder=Search actions (e.g.: scene, shortcut, mute)">
      <button class="icon-btn" id="actionClose" data-i18n-attr="aria-label=Close"><i data-lu="x"></i></button>
    </div>
    <div class="picker" id="actionGroups"></div>
  </div>
</div>

<div class="sheet" id="historySheet" hidden>
  <div class="sheet-card history-card" role="dialog" data-i18n-attr="aria-label=Version history" id="historyCard"></div>
</div>


<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="importPick" accept=".zip,.yaml,.yml" hidden>
<script src="i18n.js"></script>
<script src="icons.js"></script>
<script src="motion.js"></script>
<script src="app.js"></script>
<script src="light.js"></script>
<script src="info.js"></script>
</body>
</html>
