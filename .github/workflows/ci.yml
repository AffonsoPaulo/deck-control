name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # Windows: o app usa ctypes/winreg e as fontes do Windows para desenhar as teclas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Dependências
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Formatação (ruff)
        run: python -m ruff format --check .
      - name: Tipos (mypy)
        run: python -m mypy
      - name: Testes (pytest)
        run: python -m pytest

  web:
    # o editor novo (React): lint (inclui as regras do design system), tipos, contrato em dia e build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: editor-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor-next/package-lock.json
      - name: Dependências
        run: npm ci
      - name: Lint, tipos e contrato
        run: npm run check
      - name: Build
        run: npx vite build

