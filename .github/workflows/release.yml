name: Versão

# Ao criar uma tag v* (v0.9.0): monta o editor, o Deck.exe e o instalador, confere o executável e anexa o
# Deck-Setup.exe no Release da tag. A versão é a de app/__init__.py e tem de bater com a tag.
# O nome da tag vem de fora: entra nos scripts só por variável de ambiente (TAG), nunca colado no texto do script.
# Dois jobs: o build (npm ci, pip install, PyInstaller: código de terceiros rodando) só pode LER o repositório;
# quem pode escrever (criar o Release) é o segundo job, que só baixa o instalador pronto e chama o gh.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # o token não fica no .git para os passos seguintes
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor-next/package-lock.json

      - name: Versão (app/__init__.py) igual à tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = python -c "import app; print(app.__version__)"
          # v0.9.0, ou uma pré-versão dela (v0.9.0-rc1): o Release sai marcado como pré-release
          if ($env:TAG -ne "v$v" -and -not $env:TAG.StartsWith("v$v-")) { throw "A tag $env:TAG não bate com app/__init__.py (v$v)" }
          "VERSION=$v" >> $env:GITHUB_ENV
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Editor (editor-next/dist)
        working-directory: editor-next
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build

      - name: Dependências do build (versões exatas)
        run: python -m pip install -r packaging/requirements-build.txt

      - name: Executável (dist/Deck)
        run: python -m PyInstaller packaging/deck.spec --noconfirm

      - name: Confere o Deck.exe (--version, --check do exemplo, recursos, plugins)
        run: python packaging/check_exe.py dist/Deck/Deck.exe

      - name: Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --version=6.7.1 -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe não encontrado em $iscc" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Instalador (packaging/Output/Deck-Setup.exe)
        run: |
          & $env:ISCC "/DAppVersion=$env:VERSION" "/DIconFile=$pwd\build\deck\deck.ico" packaging\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Testes do Python (depois do build, para o ambiente do build ficar só com o que vai no pacote)
        run: |
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pytest

      - uses: actions/upload-artifact@v4
        with:
          name: Deck-Setup
          path: packaging/Output/Deck-Setup.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # criar o Release e anexar o instalador (nada de terceiros roda aqui)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Deck-Setup
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" Deck-Setup.exe --clobber
          else
            gh release create "$TAG" Deck-Setup.exe --title "Deck ${TAG#v}" --generate-notes $pre
          fi
