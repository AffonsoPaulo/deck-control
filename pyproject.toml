[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deck"
dynamic = ["version"]  # vem de app/__init__.py (__version__): um lugar só
description = "App para o Fifine AmpliGame D6: teclas, luz, widgets e plugins, com editor no navegador."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hidapi>=0.14",
    "Pillow>=10",
    "PyYAML>=6",
    # o configio mexe em partes internas do ruamel (comentários): versão nova só depois de testar
    "ruamel.yaml>=0.18,<0.20",
    "pystray>=0.19",
    "obsws-python>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # versões fixas: a formatação e as checagens dão o mesmo resultado aqui e na CI
    "ruff==0.15.9",
    "mypy==1.18.2",
    "types-PyYAML",
    # confere as respostas da API contra o contrato exportado (independente de app/editor/contract.py)
    "jsonschema==4.23.0",
]

[project.scripts]
deck = "app.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*", "d6*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.html", "*.css", "*.js", "*.ttf", "*.png", "*.ico", "*.svg"]

# ---------------------------------------------------------------------------- testes

[tool.pytest.ini_options]
# só a pasta tests/: os scripts de tools/ (draw_test.py etc.) falam com o D6 de verdade
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

# ---------------------------------------------------------------------------- lint e formatação

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["scratch", "examples", ".claude", "editor-next/node_modules"]

[tool.ruff.lint]
# Sem "I" (ordem dos imports) por enquanto: a ordem importa até a Fase 1 acabar com o ciclo actions <-> plugins.
select = ["E4", "E7", "E9", "F", "W", "B"]
ignore = [
    "E731",  # lambda curta atribuída a um nome é comum no código
    "E741",  # nome "l" em laços curtos
    "B905",  # zip sem strict=
]

[tool.ruff.lint.per-file-ignores]
"d6/device.py" = ["E702"]          # montagem dos pacotes HID, uma linha por campo de propósito
"app/editor/server.py" = ["E702"]
"tests/*" = ["B011"]

# ---------------------------------------------------------------------------- tipos

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Começa leve: só os módulos listados em "files" são checados. Cada módulo refeito entra na lista, já estrito.
# Próximos: widgets, values e binds (hoje têm avisos de tipo, sem bug conhecido).
files = [
    "app/configio.py",
    # o config por seção (Fase 4): o modelo, os validadores e o build_config
    "app/config.py",
    "app/configmodel.py",
    "app/configpages.py",
    "app/configsections.py",
    "app/storage.py",
    "app/i18n.py",
    "app/bootstrap.py",
    "app/errors.py",
    "app/paths.py",
    "app/editor/contract.py",
    "app/editor/api/__init__.py",
    "app/editor/api/context.py",
    # o engine dividido (Fase 3); leds.py e engine.py ficam fora do estrito: chamam o lighting e as automações,
    # que ainda não têm tipos
    "app/engine/__init__.py",
    "app/engine/core.py",
    "app/engine/session.py",
    "app/engine/recorder.py",
    "app/engine/timers.py",
    "app/engine/navigation.py",
    "app/engine/states.py",
    "app/engine/drawing.py",
    "app/engine/input.py",
    "app/engine/leds.py",
    "app/engine/engine.py",
    # plugins (Fase 6): a API entregue ao plugin; manager.py e external.py ainda não
    "app/plugins/api.py",
]
follow_imports = "silent"
warn_unused_ignores = true

# Código novo (Fase 1 em diante) entra estrito.
[[tool.mypy.overrides]]
module = [
    "app.bootstrap",
    "app.errors",
    "app.config",
    "app.configmodel",
    "app.configpages",
    "app.configsections",
    "app.storage",
    "app.paths",
    "app.editor.contract",
    "app.editor.api",
    "app.editor.api.context",
    "app.engine",
    "app.engine.core",
    "app.engine.session",
    "app.engine.recorder",
    "app.engine.timers",
    "app.engine.navigation",
    "app.engine.states",
    "app.engine.drawing",
    "app.engine.input",
    "app.plugins.api",
]
# o "strict" do mypy só vale para o projeto inteiro; estas são as partes dele que funcionam por módulo
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true
